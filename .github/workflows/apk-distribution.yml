name: Android APK distribution

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Etiqueta opcional para identificar el build"
        required: false
        default: manual
  push:
    branches:
      - main

jobs:
  build-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        uses: gradle/gradle-build-action@v2
        with:
          arguments: :app:assembleDebug
          build-root-directory: LinguaBridge
          gradle-version: 8.7

      - name: Preparar artefacto APK
        run: |
          mkdir -p LinguaBridge/dist
          apk_name="LinguaBridge-${GITHUB_RUN_NUMBER}.apk"
          cp LinguaBridge/app/build/outputs/apk/debug/app-debug.apk "LinguaBridge/dist/${apk_name}"
          echo "apk_name=${apk_name}" >> $GITHUB_ENV

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Linguabridge-apk
          path: LinguaBridge/dist/*.apk
          retention-days: 7

      - name: Publicar release con enlace directo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: LinguaBridge build #${{ github.run_number }}
          body: |
            Compilación automática de LinguaBridge lista para descargar.

            Canal: ${{ github.event.inputs.channel }}
          files: LinguaBridge/dist/${{ env.apk_name }}
          prerelease: false

